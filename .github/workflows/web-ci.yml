name: Web Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Python for Secret Guard
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Secret Scanner
        run: python ./scripts/secret_scanner.py

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Web Bundle
        run: npm run build
